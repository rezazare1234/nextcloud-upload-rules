<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">How rules are evaluated</title><desc id="desc">Rules are evaluated in order. Disabled, excluded and nonmatching rules are skipped. The first matching rule supplies the limit and message. No match means no restriction from this app.</desc>
<rect width="1200" height="470" rx="20" fill="#f2f6fa"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="52" font-size="26" font-weight="700" fill="#17334a">One upload. One matching rule.</text><text x="40" y="86" font-size="17" fill="#526775">Evaluate from top to bottom using the uploader's identity and the filename.</text>
<g fill="white" stroke="#cddbe5"><rect x="40" y="127" width="340" height="192" rx="14"/><rect x="430" y="127" width="340" height="192" rx="14"/><rect x="820" y="127" width="340" height="192" rx="14"/></g>
<g fill="#17334a" font-size="21" font-weight="700"><text x="62" y="166">1. Check the audience</text><text x="452" y="166">2. Match the filename</text><text x="842" y="166">3. Apply this rule</text></g>
<g fill="#526775" font-size="17"><text x="62" y="204">Everyone, selected groups, or users</text><text x="62" y="235">Excluded user? Skip this rule.</text><text x="62" y="266">Disabled rule? Skip this rule.</text><text x="452" y="204">Match one of the extensions.</text><text x="452" y="235">Use * for every filename.</text><text x="452" y="266">No match? Try the next rule.</text><text x="842" y="204">Check the size or block the upload.</text><text x="842" y="235">Use this rule's custom message.</text><text x="842" y="266">Stop: later rules do not combine.</text></g>
<g stroke="#087f91" stroke-width="3" fill="none"><path d="M389 223h30m-9 -8 9 8-9 8"/><path d="M779 223h30m-9 -8 9 8-9 8"/></g>
<rect x="40" y="352" width="1120" height="78" rx="12" fill="#dceef0"/><text x="62" y="383" font-size="18" font-weight="700" fill="#075e78">No matching rule = no restriction from this app.</text><text x="62" y="409" font-size="16" fill="#315f69">Exclusions skip only one rule. A later general rule can still apply. Other server limits remain independent.</text>
</g></svg>