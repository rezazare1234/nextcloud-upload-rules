<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Nextcloud Upload Rules</title><desc id="desc">Control upload sizes, filename extensions and audiences with ordered rules.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09283f"/><stop offset="1" stop-color="#075e78"/></linearGradient></defs>
<rect width="1200" height="460" rx="24" fill="url(#bg)"/>
<circle cx="1120" cy="25" r="230" fill="#13a6ba" opacity=".12"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="56" y="66" fill="#86dfea" font-size="15" letter-spacing="3">NEXTCLOUD 34 ? ADMINISTRATION</text>
<text x="56" y="135" fill="#ffffff" font-size="48" font-weight="700">Upload Rules</text>
<text x="56" y="180" fill="#c8dee7" font-size="21">The right limit. The right people. A clear message.</text>
<g transform="translate(56 232)"><rect width="340" height="168" rx="16" fill="#ffffff"/>
<text x="24" y="38" fill="#087f91" font-size="14" font-weight="700">01 / FILE POLICY</text><text x="24" y="78" fill="#17334a" font-size="23" font-weight="700">Extensions + size limits</text><text x="24" y="114" fill="#526775" font-size="17">One rule for MP4, PDF or all files.</text><text x="24" y="142" fill="#526775" font-size="17">Allow up to a limit, or block uploads.</text></g>
<g transform="translate(430 232)"><rect width="340" height="168" rx="16" fill="#ffffff"/>
<text x="24" y="38" fill="#087f91" font-size="14" font-weight="700">02 / AUDIENCE</text><text x="24" y="78" fill="#17334a" font-size="23" font-weight="700">Groups + individuals</text><text x="24" y="114" fill="#526775" font-size="17">Choose who each rule applies to.</text><text x="24" y="142" fill="#526775" font-size="17">Exclude individual users when needed.</text></g>
<g transform="translate(804 232)"><rect width="340" height="168" rx="16" fill="#ffffff"/>
<text x="24" y="38" fill="#087f91" font-size="14" font-weight="700">03 / FEEDBACK</text><text x="24" y="78" fill="#17334a" font-size="23" font-weight="700">Your own message</text><text x="24" y="114" fill="#526775" font-size="17">Explain the limit before uploading.</text><text x="24" y="142" fill="#526775" font-size="17">Backed by server-side enforcement.</text></g>
</g></svg>