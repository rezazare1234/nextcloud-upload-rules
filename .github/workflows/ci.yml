name: Validate app
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
      - name: Validate and test
        run: python3 tools/check.py
      - name: Build installable archives
        run: python3 tools/build.py
